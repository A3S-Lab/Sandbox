name: CI

on:
  push:
    branches: [main, codex/sandbox-publish-20261018]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          rustc --version --verbose
      - name: Prepare Linux sandbox host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl -N kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if sysctl -N kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build bins for mediation relay tests
        run: cargo build --bins --locked
      - name: Verify macOS CONNECT in isolation
        if: runner.os == 'macOS'
        run: cargo test --lib --locked policy::gate4_integration::gate4_macos_sandbox_mediator_tunnels_allowed_connect -- --exact --nocapture
      - name: Run tests
        id: unix-suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo test --all-targets --locked 2>&1 | tee suite.log
      - name: Re-run failed Unix contracts individually
        if: failure() && steps.unix-suite.outcome == 'failure'
        shell: bash
        run: |
          set +e
          index=0
          while IFS= read -r test; do
            cargo test --all-targets --locked "$test" -- --exact --nocapture 2>&1 | tee "solo-$index.log"
            index=$((index + 1))
          done < <(awk '/^test .* \.\.\. FAILED$/ { print $2 }' suite.log)
          if [[ "$index" == 0 ]]; then exit 1; fi
          exit 0
      - name: Run Windows tests with bounded diagnostics
        id: windows-suite
        if: runner.os == 'Windows'
        timeout-minutes: 45
        env:
          GATE7_SOAK_ROUNDS: "64"
        run: |
          cargo test --all-targets --locked -- --test-threads=1 --nocapture 2>&1 | Tee-Object suite.log
          exit $LASTEXITCODE
      - name: Re-run failed Windows contracts individually
        if: failure() && steps.windows-suite.outcome == 'failure'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = Select-String -Path suite.log -Pattern '^test (\S+) \.\.\. FAILED$'
          if (-not $failed) { throw 'suite failed without an individually runnable test' }
          $index = 0
          foreach ($failure in $failed) {
            $test = $failure.Matches[0].Groups[1].Value
            cargo test --all-targets --locked $test -- --exact --test-threads=1 --nocapture 2>&1 | Tee-Object "solo-$index.log"
            $index++
          }
          exit 0
      - name: Verify the Windows host-death oracle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'src/platform/windows.rs'
          $original = [IO.File]::ReadAllText($path)
          try {
            $mutated = $original.Replace('let mut flags = JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE', 'let mut flags = 0')
            if ($mutated -eq $original) { throw 'kill-on-close mutation did not apply' }
            [IO.File]::WriteAllText($path, $mutated)
            $PSNativeCommandUseErrorActionPreference = $false
            cargo test --test windows_lifetime --locked killing_the_host_stops_the_root_and_descendant_without_rust_cleanup -- --exact --nocapture 2>&1 | Tee-Object mutation.log
            if ($LASTEXITCODE -eq 0) { throw 'host-death oracle accepted missing kill-on-close' }
            if (-not (Select-String -Path mutation.log -SimpleMatch 'a sandbox process survived termination' -Quiet)) { throw 'mutation failed for an unrelated reason' }
          } finally {
            [IO.File]::WriteAllText($path, $original)
          }
          git diff --exit-code -- src/platform/windows.rs
          exit $LASTEXITCODE
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 'stable'
          cache: false
      - name: Test Go SDK protocol
        working-directory: sdk/go
        run: go test ./...
      - name: Test Go SDK with the real bridge
        if: runner.os != 'Windows'
        working-directory: sdk/go
        shell: bash
        run: A3S_SANDBOX_BRIDGE="$GITHUB_WORKSPACE/target/debug/a3s-sandbox-bridge" go test -race -run Integration -v ./...
      - name: Build release binaries
        run: cargo build --release --bins --locked
      - name: Package native binaries
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          host=$(rustc -vV | sed -n 's/^host: //p')
          package="a3s-sandbox-v${version}-${host}"
          mkdir -p "$RUNNER_TEMP/$package" dist
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          for binary in a3s-sandbox a3s-sandbox-relay a3s-sandbox-bridge; do
            cp "target/release/${binary}${suffix}" "$RUNNER_TEMP/$package/"
          done
          cp LICENSE README.md README.zh-CN.md docs/RELEASE_NOTES_0.3.0.md "$RUNNER_TEMP/$package/"
          git rev-parse HEAD > "$RUNNER_TEMP/$package/SOURCE_COMMIT"
          tar -czf "dist/$package.tar.gz" -C "$RUNNER_TEMP" "$package"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        if: github.event_name != 'pull_request'
        id: provenance
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-${{ runner.os }}-${{ github.sha }}
          path: |
            *.log
            dist/*.tar.gz
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
